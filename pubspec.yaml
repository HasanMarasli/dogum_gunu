name: dogum_gunu
description: "Doğum günlerini hatırlatan, burcu gösteren ve hediye öneren uygulama."
publish_to: "none"

version: 1.1.0+4

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.1
  sqflite: ^2.4.1
  get: ^4.6.6
  uuid: ^4.5.1
  intl: ^0.20.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_svg: ^2.0.16
  path: ^1.9.0
  get_storage: ^2.1.1
  app_settings: ^9.0.1
  flutter_timezone: ^5.1.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/svg/burclar/

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree/Figtree-Bold.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque/BricolageGrotesque-Bold.ttf
          weight: 700

